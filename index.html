<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Form</title>

</head>

<body class="flex">
    <div class="container">
        <div class="formBox ">

                <img src="git.png" alt="GitHub" width="25">

            </div>


        </div>


        <div class="signup flex">
            <h4>Already have an account?</h4> <span>Sign In</span>
        </div>
    </div>

</html>
